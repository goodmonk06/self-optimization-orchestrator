version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: repo-orchestrator-db
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator_dev_pass
      POSTGRES_DB: repo_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-network

  redis:
    image: redis:7-alpine
    container_name: repo-orchestrator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - orchestrator-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repo-orchestrator-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator_dev_pass@postgres:5432/repo_orchestrator?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      NODE_ENV: production
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orchestrator-network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repo-orchestrator-worker
    environment:
      DATABASE_URL: postgresql://orchestrator:orchestrator_dev_pass@postgres:5432/repo_orchestrator?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    networks:
      - orchestrator-network
    restart: unless-stopped

networks:
  orchestrator-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
